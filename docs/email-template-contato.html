<!-- Template do e-mail de notificação do formulário de contato (EmailJS).
     Cole este HTML no editor de código do template no EmailJS (Email Templates
     → seu template → botão "Code Editor" / </> no canto do editor).
     Variáveis usadas (precisam bater com os nomes enviados em template_params
     no js/app.js): {{name}}, {{email}}, {{tipo_projeto}}, {{message}}, {{sent_at}} -->
<div style="background:#F3ECDC; padding:32px 16px; font-family:'Manrope', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; background:#FCF8EE; border-radius:16px; overflow:hidden; border:1px solid #DCD2BC;">
    <tr>
      <td style="padding:28px 32px 20px;">
        <img src="https://onda.business/assets/brand/logo-onda.png" alt="Onda" width="110" height="32" style="display:block; border:0;" />
      </td>
    </tr>
    <tr>
      <td style="padding:0;">
        <img src="https://onda.business/assets/email/gradient-bar.png" alt="" width="600" height="4" style="display:block; width:100%; height:4px; border:0;" />
      </td>
    </tr>
    <tr>
      <td style="padding:28px 32px 8px;">
        <h1 style="margin:0 0 4px; font-family:'Manrope', Arial, sans-serif; font-size:22px; font-weight:800; color:#0E2A33;">Novo contato pelo site</h1>
        <p style="margin:0; font-size:13px; color:#4C636A;">Enviado em {{sent_at}} via onda.business</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 4px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:10px 0; border-bottom:1px solid #E6DDC9;">
              <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4C636A;">Nome</span>
              <span style="display:block; font-size:15px; color:#0E2A33; margin-top:2px;">{{name}}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 0; border-bottom:1px solid #E6DDC9;">
              <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4C636A;">E-mail</span>
              <span style="display:block; font-size:15px; color:#0E2A33; margin-top:2px;"><a href="mailto:{{email}}" style="color:#0E2A33; text-decoration:none;">{{email}}</a></span>
            </td>
          </tr>
          <tr>
            <td style="padding:10px 0; border-bottom:1px solid #E6DDC9;">
              <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4C636A;">Tipo de projeto</span>
              <span style="display:block; font-size:15px; color:#0E2A33; margin-top:2px;">{{tipo_projeto}}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 0 4px;">
              <span style="display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4C636A; margin-bottom:6px;">Mensagem</span>
              <span style="display:block; font-size:15px; line-height:1.6; color:#0E2A33; white-space:pre-wrap;">{{message}}</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 32px 32px;">
        <a href="mailto:{{email}}" style="display:inline-block; background:#0E2A33; color:#FCF8EE; text-decoration:none; font-weight:700; font-size:14px; padding:12px 22px; border-radius:100px;">Responder {{name}}</a>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 32px; background:#F3ECDC; border-top:1px solid #DCD2BC;">
        <p style="margin:0; font-size:12px; color:#4C636A;">Onda · Estúdio de produtos digitais · Fortaleza, Ceará</p>
      </td>
    </tr>
  </table>
</div>
